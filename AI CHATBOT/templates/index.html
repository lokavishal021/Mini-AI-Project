<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBot</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F3E8FF;
            color: #000000;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Neo-Brutalism */
        .sidebar {
            width: 280px;
            height: 100vh;
            background-color: #C084FC;
            border-right: 2px solid #000000;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 2px solid #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #A855F7;
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .close-sidebar {
            background: none;
            border: none;
            cursor: pointer;
            display: none; /* hidden on desktop */
        }

        .sidebar-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-btn {
            padding: 12px 16px;
            background-color: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s;
        }

        .sidebar-btn:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(3px, 3px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #F3E8FF;
        }

        .header {
            padding: 16px 24px;
            background-color: #FFFFFF;
            border-bottom: 2px solid #000000;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hamburger {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-box {
            flex: 1;
            padding: 24px 10%;
            overflow-y: auto;
            background-color: #FFFFFF;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 14px 18px;
            border: 2px solid #000000;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            box-shadow: 3px 3px 0px #000000;
        }

        .message.user .message-content {
            background-color: #C084FC;
        }

        .message.bot .message-content {
            background-color: #F3E8FF;
        }

        .input-container {
            padding: 24px 10%;
            background-color: #FFFFFF;
            border-top: 2px solid #000000;
        }

        .input-area {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 14px 20px;
            background-color: #F3E8FF;
            border: 2px solid #000000;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            box-shadow: inset 3px 3px 0px rgba(0,0,0,0.05);
        }

        #userInput:focus {
            background-color: #FFFFFF;
            box-shadow: 3px 3px 0px #000000;
            transform: translate(-3px, -3px);
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: #A855F7;
            color: #000000;
            border: 2px solid #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s;
        }

        .icon-btn:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(3px, 3px);
        }

        #fileInput { display: none; }
        .loading { display: none; text-align: center; margin-top: 10px; font-weight: 700; }
        pre { white-space: pre-wrap; font-family: Consolas, monospace; font-weight: 600; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .close-sidebar {
                display: block;
            }
            .chat-box, .input-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="close-sidebar" onclick="toggleSidebar()"><i data-lucide="x"></i></button>
        </div>
        <div class="sidebar-content">
            <button class="sidebar-btn"><i data-lucide="message-square-plus"></i> New Chat</button>
            <button class="sidebar-btn"><i data-lucide="folder-plus"></i> New Project</button>
            <button class="sidebar-btn"><i data-lucide="settings"></i> Settings</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <button class="hamburger" onclick="toggleSidebar()"><i data-lucide="menu" size="28"></i></button>
            <h1><i data-lucide="bot" size="32"></i> OmniBot Assistant</h1>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your OmniBot assistant. How can I help you today?<br><br>
                    You can:<br>
                    - Ask math questions<br>
                    - Search Wikipedia<br>
                    - Request program code<br>
                    - Upload images/documents<br>
                </div>
            </div>
        </div>
        <div class="loading" id="loading">Processing request...</div>

        <div class="input-container">
            <div class="input-area">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Upload file">
                    <i data-lucide="paperclip"></i>
                </button>
                <input type="file" id="fileInput" accept=".png,.jpg,.pdf,.docx,.txt" onchange="uploadFile()">

                <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice input">
                    <i data-lucide="mic"></i>
                </button>

                <input type="text" id="userInput" placeholder="Message OmniBot..." onkeypress="handleKeyPress(event)">

                <button class="icon-btn" id="muteBtn" onclick="toggleMute()" title="Toggle Audio">
                    <i data-lucide="volume-2"></i>
                </button>

                <button class="icon-btn" style="background-color: #C084FC;" onclick="sendMessage()" title="Send">
                    <i data-lucide="send"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Additional sidebar toggle logic
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if(sidebar.style.transform === 'translateX(-100%)' || sidebar.classList.contains('active')) {
                sidebar.classList.toggle('active');
            } else {
                if(window.innerWidth > 768) {
                    sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
                }
            }
        }


        lucide.createIcons();

        let isAudioMuted = false;
        let isRecording = false;
        let recognition = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                stopRecording();
            };

            recognition.onerror = function(event) {
                console.error('Speech recognition error:', event.error);
                stopRecording();
            };

            recognition.onend = function() {
                stopRecording();
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser.');
                return;
            }
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                recognition.start();
                startRecording();
            }
        }

        function startRecording() {
            isRecording = true;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('recording');
            micBtn.innerHTML = '<i data-lucide="mic-off"></i>';
            lucide.createIcons();
        }

        function stopRecording() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('recording');
            micBtn.innerHTML = '<i data-lucide="mic"></i>';
            lucide.createIcons();
        }

        function toggleMute() {
            isAudioMuted = !isAudioMuted;
            const muteBtn = document.getElementById('muteBtn');

            if (isAudioMuted) {
                muteBtn.classList.add('muted');
                muteBtn.innerHTML = '<i data-lucide="volume-x"></i>';
                window.speechSynthesis.cancel();
            } else {
                muteBtn.classList.remove('muted');
                muteBtn.innerHTML = '<i data-lucide="volume-2"></i>';
            }
            lucide.createIcons();
        }

        function speakText(text) {
            if (isAudioMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/```[\s\S]*?```/g, 'code block')
                                  .replace(/\*\*(.*?)\*\*/g, '$1')
                                  .replace(/<[^>]*>/g, '')
                                  .replace(/\n\n+/g, '. ');

            let chunks = [];
            let currentChunk = '';
            const sentences = cleanText.split(/([.!?]+)/);
            
            for (let i = 0; i < sentences.length; i++) {
                currentChunk += sentences[i];
                if (currentChunk.length > 150 && /[.!?]/.test(sentences[i])) {
                    chunks.push(currentChunk);
                    currentChunk = '';
                }
            }
            if (currentChunk) chunks.push(currentChunk);

            let currentIndex = 0;
            function speakNextChunk() {
                if (currentIndex < chunks.length && !isAudioMuted) {
                    const utterance = new SpeechSynthesisUtterance(chunks[currentIndex]);
                    utterance.rate = 0.9;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    utterance.onend = function() { currentIndex++; speakNextChunk(); };
                    utterance.onerror = function(e) { console.error('Speech error:', e); currentIndex++; speakNextChunk(); };
                    window.speechSynthesis.speak(utterance);
                }
            }
            speakNextChunk();
        }

        function addMessage(message, isUser, speakContent = null) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerHTML = formatMessage(message);
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

            if (!isUser) {
                const textToSpeak = speakContent !== null ? speakContent : message;
                speakText(textToSpeak);
            }
        }

        function addCollapsibleContent(content) {
            const chatBox = document.getElementById('chatBox');
            const collapsibleDiv = document.createElement('div');
            collapsibleDiv.className = 'collapsible-content';
            collapsibleDiv.innerHTML = `
                <button class="collapsible-btn" onclick="toggleCollapsible(this)">
                    <i data-lucide="chevron-down"></i> Hide Full Document
                </button>
                <div class="collapsible-body">
                    <pre>${content}</pre>
                </div>
            `;
            chatBox.appendChild(collapsibleDiv);
            lucide.createIcons();
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        }

        function toggleCollapsible(button) {
            const body = button.nextElementSibling;
            if (body.style.display === 'none') {
                body.style.display = 'block';
                button.innerHTML = '<i data-lucide="chevron-up"></i> Hide Full Document';
            } else {
                body.style.display = 'none';
                button.innerHTML = '<i data-lucide="chevron-down"></i> View Full Document';
            }
            lucide.createIcons();
        }

        function formatMessage(message) {
            message = message.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre>$2</pre>');
            message = message.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            message = message.replace(/\n/g, '<br>');
            return message;
        }

        function showLoading() { document.getElementById('loading').style.display = 'block'; }
        function hideLoading() { document.getElementById('loading').style.display = 'none'; }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            addMessage(message, true);
            input.value = '';
            showLoading();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                hideLoading();

                if (data.text) {
                    addMessage(data.text, false, data.speak);
                    if (data.full_content) addCollapsibleContent(data.full_content);
                } else if (data.reply && typeof data.reply === 'string' && data.reply.startsWith('OPEN_')) {
                    const sites = {
                        'OPEN_YOUTUBE': 'https://www.youtube.com',
                        'OPEN_GOOGLE': 'https://www.google.com',
                        'OPEN_FACEBOOK': 'https://www.facebook.com',
                        'OPEN_SBTET': 'https://www.sbtet.ap.gov.in',
                        'OPEN_MUSIC': 'https://www.spotify.com'
                    };
                    if (sites[data.reply]) {
                        window.open(sites[data.reply], '_blank');
                        addMessage('Opening website...', false);
                    }
                } else if (data.reply) {
                    addMessage(data.reply, false);
                }
            } catch (error) {
                hideLoading();
                addMessage('Sorry, there was an error processing your request.', false);
                console.error('Error:', error);
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;

            addMessage(`Uploading ${file.name}...`, true);
            showLoading();

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                hideLoading();

                if (data.type === 'document') {
                    addMessage(data.message, false, data.speak);
                } else if (data.caption) {
                    addMessage(data.caption, false);
                } else if (data.type === 'text') {
                    const preview = data.result.length > 500 ? data.result.substring(0, 500) + '...' : data.result;
                    addMessage(`File content:\n\n${preview}`, false);
                } else if (data.status === 'error') {
                    addMessage(`Error: ${data.message}`, false);
                } else {
                    addMessage('File uploaded successfully!', false);
                }
            } catch (error) {
                hideLoading();
                addMessage('Sorry, there was an error uploading the file.', false);
            }
            fileInput.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        window.onload = function() {
            document.getElementById('userInput').focus();
        };
    
    </script>
</body>
</html>
